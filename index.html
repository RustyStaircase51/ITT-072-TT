<!-- Homework Tracker -->
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/style.css">
    <script src="js/homework.js" defer></script>
	<title>Homework Dashboard</title>
</head>
<body>


<header>
		<h1>Homework Dashboard</h1>
</header>


<main class="container">    
    
    
    <section id="form">
		<h2>Add a Task</h2>
		<form novalidate id="taskForm">
			<label>
				Task:
				<input id="taskAdd" type="text" placeholder="Finish Module 4" required />
			</label>

			<br>

			<label>
                Category:
				<select id="categoryAdd" name="category">
                    <option value = "quiz">Quiz</option>
                    <option value = "reading">Reading</option>
                    <option value = "notes">Notes</option>
                    <option value = "assignment">Assignment</option>
                </select>
			</label>

			<br>
		
			<button id="create_task" type="submit">Create Task</button>
            

        </form>
	</section>
	
    <section id="errors">
	    <p id="error_message"></p>
	</section>

    <!-- This will show the number of tasks (3 tasks remaining) if zero tasks will display "Add a homework assignment to get started"-->
    <section id = "task_counter">

    </section>
    
    <!-- Category Sort by Assignment Type (Default will show all assignments) -->
    <label>
        Current Category:
        <select id= "category">
            <option value = "all">All</option>
            <option value = "quiz">Quiz</option>
            <option value = "reading">Reading</option>
            <option value = "notes">Notes</option>
            <option value = "assignment">Assignment</option>
            <option value = "complete">Complete</option>
            <option value = "incomplete">Incomplete</option>
        </select>
    </label>
    <!-- This will display all the tasks according to the category selected above -->
    <section id = "task_list">

    </section>
    


</main>
</body>
</html>
